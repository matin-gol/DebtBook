name: Build DebtBook APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debtbook-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (ARM 32-bit and 64-bit)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            cmake \
            gettext \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            make \
            patch \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Create build environment and install pinned tools
        run: |
          python -m venv .venv-build
          . .venv-build/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'Cython==0.29.34' 'buildozer==1.6.0'

      - name: Validate project inputs
        run: |
          test -f buildozer.spec || { echo 'ERROR: buildozer.spec is missing from repository root.'; exit 1; }
          test -f main.py || { echo 'ERROR: main.py is missing from repository root.'; exit 1; }
          test -f database.py || { echo 'ERROR: database.py is missing from repository root.'; exit 1; }
          test -f fonts/Vazirmatn.ttf || { echo 'ERROR: fonts/Vazirmatn.ttf is missing. Add the Persian font used by main.py.'; exit 1; }
          grep -q '^ *p4a.branch *= *master *$' buildozer.spec

      - name: Build debug APKs
        shell: bash
        run: |
          source .venv-build/bin/activate
          buildozer -v android debug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DebtBook-Android-APKs
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
