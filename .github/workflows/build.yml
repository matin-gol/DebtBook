name: Build DebtBook Android APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debtbook-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs (ARMv7 and ARM64)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Buildozer runs on Python 3.10; p4a's Android Python is selected
      # by the pinned p4a revision, not by this host interpreter.
      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Create isolated build environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-build
          source .venv-build/bin/activate

          # Keep pip on a version compatible with the pinned p4a tooling.
          # Do not run an unpinned "pip install -U pip" during the build.
          python -m pip install --no-cache-dir \
            "pip==24.3.1" \
            "setuptools==75.8.0" \
            "wheel==0.45.1"

          python -m pip install --no-cache-dir \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          python -m pip --version
          buildozer --version

      - name: Validate project files and build configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f buildozer.spec || {
            echo "::error::buildozer.spec is missing from the repository root."
            exit 1
          }
          test -f main.py || {
            echo "::error::main.py is missing from the repository root."
            exit 1
          }
          test -f database.py || {
            echo "::error::database.py is missing from the repository root."
            exit 1
          }
          test -f fonts/Vazirmatn.ttf || {
            echo "::error::fonts/Vazirmatn.ttf is missing. main.py registers this font."
            exit 1
          }

          grep -Eq '^[[:space:]]*android\.api[[:space:]]*=[[:space:]]*35([[:space:]]*(#.*)?)?$' buildozer.spec
          grep -Eq '^[[:space:]]*android\.minapi[[:space:]]*=[[:space:]]*26([[:space:]]*(#.*)?)?$' buildozer.spec
          grep -Eq '^[[:space:]]*android\.ndk[[:space:]]*=[[:space:]]*25c([[:space:]]*(#.*)?)?$' buildozer.spec
          grep -Eq '^[[:space:]]*p4a\.commit[[:space:]]*=[[:space:]]*0382d27de2f7315ed98e74884bafb30365decdee([[:space:]]*(#.*)?)?$' buildozer.spec

          grep -Eq '^[[:space:]]*android\.archs[[:space:]]*=.*armeabi-v7a.*arm64-v8a|^[[:space:]]*android\.archs[[:space:]]*=.*arm64-v8a.*armeabi-v7a' buildozer.spec

          echo "Required source files and Android settings are present."

      - name: Build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          source .venv-build/bin/activate
          buildozer -v android debug

      - name: Show generated APKs
        if: always()
        shell: bash
        run: |
          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name '*.apk' -print
          else
            echo "No bin/ directory was generated."
          fi

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DebtBook-Android-APKs
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
