name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # اجازه می‌دهد بیلد را به صورت دستی هم اجرا کنید

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04
    timeout-minutes: 60 # جلوگیری از گیر کردن بیلد در صورت بروز مشکل

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # نسخه 3.9 برای جلوگیری از خطای jnius الزامی است

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Set up Java 17 Environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 # نسخه Cython پین شده برای جلوگیری از خطاهای کامپایل

      - name: Cache Buildozer Directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build with Buildozer
        run: |
          # اجرای بیلد در حالت debug
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-debug-apk
          path: bin/*.apk
          if-no-files-found: error # اگر APK ساخته نشد، بیلد را fail کن