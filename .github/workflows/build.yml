name: Build DebtBook Universal Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Android Gradle Plugin requires JDK 17.
      # Explicitly select Java 17 rather than the runner's default Java 11.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java version
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          python --version
          JAVA_MAJOR="$(java -version 2>&1 | head -n 1 | grep -oE '"[0-9]+' | tr -d '"')"
          test "$JAVA_MAJOR" = "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zip unzip \
            python3-pip python3-venv autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0"

      - name: Check project files
        run: |
          test -f buildozer.spec
          test -f main.py
          test -f database.py
          test -f fonts/Vazirmatn.ttf

      - name: Clean previous build output
        run: |
          rm -rf .buildozer bin

      - name: Build universal Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/debtbook-release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          export P4A_RELEASE_KEYSTORE="$KEYSTORE_PATH"
          export P4A_RELEASE_KEYSTORE_PASSWD="$ANDROID_KEYSTORE_PASSWORD"
          export P4A_RELEASE_KEYALIAS="$ANDROID_KEY_ALIAS"
          export P4A_RELEASE_KEYALIAS_PASSWD="$ANDROID_KEY_PASSWORD"

          echo "Building signed release APK with:"
          java -version
          buildozer -v android release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DebtBook-universal-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14